# Static hosting for apps/web. The CSP header belongs here, not in the HTML:
# `frame-ancestors` is ignored when delivered in a <meta> tag.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.jstarcards.jp; media-src 'self' blob: https://cdn.jstarcards.jp; connect-src 'self' https://api.jstarcards.jp https://*.aliyuncs.com wss://*.aliyuncs.com https://*.aliyun.com wss://*.aliyun.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
