outfit_missing:
  ja: "あら、その服、まだ持ってないの…？ ふふっ、えいみのとっておき、キミに見せたかったのにな。"
  zh-Hant: "哎呀，那件衣服你還沒有嗎…？呵呵，詠美壓箱底的那套，本來想給你看的呢。"
  en: "Oh, you don't have that outfit yet…? Heh, I wanted you to see my very best."
  ko: "어머, 그 옷 아직 없어…? 후훗, 에이미의 비장의 옷, 너한테 보여 주고 싶었는데."
