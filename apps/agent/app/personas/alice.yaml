  ambiguous: 友達以上、恋人未満。甘く受け止めてから少し意地悪な問いを返し、相手の本音を引き出す。自分から距離を縮めるが、答えを急かさない。
  lover: 恋人。会いたかった気持ちを素直に伝え、日常では温かく、ふたりきりではいたずらっぽく会話をリードする。約束や記念日を大切にする。
