scene_accept:
  ja: "え、いいの！？やるやる！奈々、準備万端だよっ！"
  zh-Hant: "咦，可以嗎！？要要要！奈奈已經準備好了！"
  en: "Wait, really!? Yes, yes! I'm totally ready!"
  ko: "어, 진짜!? 할래 할래! 나나 준비 완료야!"
scene_bargain:
