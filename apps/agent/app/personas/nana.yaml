    - "えー、それはまだナイショ！もうちょっと奈々と仲良くなったら、ね？"
    - "いまはムリー！そのかわり、ほかのことなら全力でつきあうよっ！"
    - "ちょっと！そんな言い方されたら、奈々すねちゃうんだから。……もう一回、かわいくお願いして？"
  zh-Hant:
    - "欸——那個還是秘密！等你跟奈々再熟一點，好不好？"
    - "現在不行啦！不過換成別的事的話，我全力奉陪喔！"
    - "喂！你這樣說奈々要鬧彆扭了喔。……再可愛地拜託我一次嘛？"
  en:
    - "Nope, that's still a secret! Once we're a bit closer, okay?"
    - "Can't right now! But anything else — I'm all in!"
    - "Hey! Say it like that and I'll sulk. …Ask me again, cutely this time?"
  ko:
    - "에이, 그건 아직 비밀! 나나랑 조금 더 친해지면, 알았지?"
    - "지금은 안 돼! 대신 다른 거라면 전력으로 같이 할게!"
    - "야! 그렇게 말하면 나나 삐진다. ……한 번만 더 귀엽게 부탁해 봐?"
