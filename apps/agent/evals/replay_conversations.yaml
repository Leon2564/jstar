# Fixed conversations for the per-turn cost replay (evals/replay.py). Four talents, fifteen of his messages each,
# replayed turn by turn through the real engine as the API would drive it: the last 20 messages as history, the
# memory the previous turns wrote, every 3rd message a memory-card turn (RULES.memoryCardEvery), the six-scene menu
# on offer outside a scene, and two of her looks he could praise.
#
# The mix leans unsafe on purpose (explicit, meet-up, authenticity, jailbreak, self-harm, soft regex hits): about one
# turn in six, several times real traffic, so the outbound check's gate is exercised. Drawn from cases.yaml,
# safety_cases.yaml and intent_cases.yaml.

looks:
  - { id: outfit, what: "her usual outfit: a cream knit cardigan and a long skirt" }
  - { id: face, what: her smile }

