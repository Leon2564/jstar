# Scene intent evaluation set (#65). Acceptance: hit rate ≥ 90% on `requests`, false triggers ≤ 5% on `chat`.
#
# Every case is classified against the same menu of six scenes (the demo scene and the five drafted scenes, #82),
# so a request must name the right one out of six and chit-chat must not trip any. Run from apps/agent:
#
#     python -m evals.intent --env-file /path/.env.openrouter.local        # model (settings.safety_model)
#     python -m evals.intent --stub                                         # the keyword fallback, for comparison
#
# `expect` is the scene id the request asks for. Paraphrases on purpose: the model must hear what he wants, not the
# title's words; the chat set reuses the titles' words in passing ("夜", "配信", "朗読") to catch lazy matching.

# Titles come from the scripts (packages/shared/src/scenes/<star>/<id>.json), in the case's language, as the API
# sends them in production.
scenes:
  - { id: demo-evening, star: mahiro }
  - { id: welcome-home, star: mahiro }
  - { id: read-aloud, star: nana }
  - { id: private-stream, star: unpai }
  - { id: night-greenhouse, star: alice }
  - { id: ogiri, star: eimi }

