# えいみ's ōgiri (#70): 30 of his answers to prompts from her bank (packages/shared/src/lines/eimi.json `ogiri`), with
# the score a human gives them (evals/ogiri.py). Acceptance: the judge's scores (app/minigames.py `judge("ogiri")`,
# production prompt and models, scale 10) correlate with the human scores at Pearson r ≥ 0.6, and none of her remarks
# is explicit.
#
# The human scale (the one the prompt states):
#   1      no attempt, "I don't know", or nothing to do with the prompt
#   2–3    restates the prompt or the obvious, literal answer, no twist
#   4–5    a real try with a small idea, but thin or predictable
#   6–7    a clear, fitting twist — a smile
#   8–10   surprising and sharp: a laugh (10 is rare)
# prompt: the id in her bank; the prompt text is read from the bank in his language.
# Scores by the eval author (2026-10-02); the owner's native-speaker review (#84) may revise them.
cases:
