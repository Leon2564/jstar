[project]
name = "jstar-agent"
version = "0.1.0"
description = "JSTAR persona service — prompts, memory, content boundary and model routing"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

# Only `app` ships; evals/ and tests/ are run from the checkout.
[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["personas/*.yaml", "world.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `python3 -m pytest apps/agent` from the repo root imports `app` too.
pythonpath = ["."]
